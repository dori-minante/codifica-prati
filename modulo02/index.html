<!DOCTYPE html> <!-- Informa ao navegador que é um documento HTML5 -->
<html lang="pt-br"> <!-- Marca o inicio da tag html. O atributo lang define o idioma do documento -->
<head> <!-- É o cabeçalho da página. A tag head é usada para conter metadados, links para arquivos externos, títulos, etc. São elementos que não são exibidos diretamente no conteúdo da página -->
  <meta charset="UTF-8"> <!-- Define a codificação de caracteres do documento como UTF-8, que é uma codificação de caracteres amplamente utilizada e suporta uma ampla gama de caracteres, incluindo acentos e caracteres especiais -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Define a configuração da viewport para garantir que a página seja exibida corretamente em dispositivos móveis. O atributo width=device-width define a largura da viewport para ser igual à largura do dispositivo, e initial-scale=1.0 define o nível de zoom inicial para 100% -->
  <title>Document</title> <!-- Define o título da página, que é exibido na aba do navegador e nos resultados de pesquisa. O conteúdo dentro da tag title é importante para SEO (Search Engine Optimization) e para a usabilidade do site -->
</head>
<body>
  <h1>Bem-vindo ao meu site!</h1>
  <h2>Site para estudo do meu curso de Full Stack</h2>
  <p>Está é uma página simples criada com HTML.</p>
  <ul> <!-- A tag ul é usada para criar uma lista não ordenada, ou seja, uma lista com marcadores. Cada item da lista é definido usando a tag li (list item) -->
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>   
</body>
</html>
